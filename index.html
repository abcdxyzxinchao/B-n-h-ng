<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>My Store - Final Version</title>
</head>
<body class="bg-gray-50">

    <nav class="flex justify-between items-center p-6 bg-white shadow-sm sticky top-0 z-50">
        <h1 class="text-2xl font-bold text-blue-600 cursor-pointer" id="nav-brand">MY STORE</h1>
        <div id="auth-nav">
            <button id="btn-show-auth" class="px-4 py-2 bg-blue-500 text-white rounded-lg">Đăng nhập</button>
        </div>
    </nav>

    <div id="app" class="p-6">
        <div id="page-home" class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <script>
                for(let i=1; i<=20; i++) {
                    document.write(`
                        <div class="bg-white p-4 rounded-xl shadow-md border relative">
                            <div class="h-40 bg-gray-200 mb-4 rounded"></div>
                            <h3 class="font-bold">Sản phẩm ${i}</h3>
                            <p class="text-red-500 font-semibold cursor-pointer">500.000đ</p>
                            <button id="btn-menu-${i}" class="absolute top-2 right-2 text-xl text-gray-500 font-bold p-2">...</button>
                            <div id="menu-${i}" class="hidden absolute right-0 bg-white shadow-lg p-2 rounded border z-40 w-32">
                                <p class="cursor-pointer hover:text-blue-500 p-1 wish-btn" data-id="${i}">Yêu thích</p>
                                <p class="cursor-pointer hover:text-blue-500 p-1 detail-btn" data-id="${i}">Chi tiết</p>
                            </div>
                        </div>
                    `);
                }
            </script>
        </div>

        <div id="page-wishlist" class="hidden">
            <h2 class="text-2xl font-bold mb-4">Danh sách yêu thích</h2>
            <div id="wishlist-container" class="grid grid-cols-1 md:grid-cols-4 gap-6"></div>
            <button onclick="showPage('home')" class="mt-6 text-blue-500 underline">Quay lại trang chủ</button>
        </div>

        <div id="page-detail" class="hidden bg-white p-8 rounded-xl shadow-md max-w-2xl mx-auto">
            <h2 id="detail-title" class="text-3xl font-bold"></h2>
            <p class="text-xl text-red-600 mt-4">Giá: 500.000đ</p>
            <button class="mt-6 bg-green-500 text-white px-6 py-2 rounded-lg">Mua ngay</button>
            <button onclick="showPage('home')" class="ml-4 text-gray-500 underline">Quay lại</button>
        </div>

        <div id="page-auth" class="hidden max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl">
            <h2 id="auth-title" class="text-2xl font-bold mb-6 text-center">Đăng nhập</h2>
            <input id="email" type="text" placeholder="Email" class="w-full p-3 border mb-4 rounded outline-none focus:ring-2 focus:ring-blue-400">
            <input id="pass" type="password" placeholder="Mật khẩu" class="w-full p-3 border mb-4 rounded outline-none focus:ring-2 focus:ring-blue-400">
            <button id="auth-action-btn" class="w-full bg-blue-600 text-white p-3 rounded-lg mb-4">Đăng nhập</button>
            <button id="google-login-btn" class="w-full bg-red-500 text-white p-3 rounded-lg">Google</button>
            <p id="toggle-text" class="mt-4 text-center cursor-pointer text-blue-500 hover:underline">Chưa có tài khoản? Đăng ký</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const auth = getAuth(initializeApp({
            apiKey: "AIzaSyBoX1FuReGf2onOHS8GlYq8jc5b5398hQU",
            authDomain: "banhang-b31dd.firebaseapp.com",
            projectId: "banhang-b31dd",
            storageBucket: "banhang-b31dd.firebasestorage.app",
            messagingSenderId: "634655097273",
            appId: "1:634655097273:web:899337e325e046eb91f668"
        }));

        window.showPage = (page) => {
            ['home', 'wishlist', 'detail', 'auth'].forEach(p => document.getElementById('page-'+p).classList.add('hidden'));
            document.getElementById('page-'+page).classList.remove('hidden');
        };

        // Logic sản phẩm
        let wishlist = [];
        document.querySelectorAll('[id^="btn-menu-"]').forEach(btn => {
            btn.onclick = (e) => { e.stopPropagation(); document.getElementById('menu-' + btn.id.split('-')[2]).classList.toggle('hidden'); };
        });

        document.querySelectorAll('.wish-btn').forEach(btn => {
            btn.onclick = () => {
                if(!wishlist.includes(btn.dataset.id)) wishlist.push(btn.dataset.id);
                alert("Đã thêm Sản phẩm " + btn.dataset.id + " vào yêu thích!");
            };
        });

        document.querySelectorAll('.detail-btn').forEach(btn => {
            btn.onclick = () => {
                document.getElementById('detail-title').innerText = "Sản phẩm " + btn.dataset.id;
                showPage('detail');
            };
        });

        // Xử lý Login
        let isLogin = true;
        document.getElementById('toggle-text').onclick = () => {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "Đăng nhập" : "Đăng ký";
            document.getElementById('auth-action-btn').innerText = isLogin ? "Đăng nhập" : "Đăng ký";
            document.getElementById('toggle-text').innerText = isLogin ? "Chưa có tài khoản? Đăng ký" : "Đã có tài khoản? Đăng nhập";
        };

        document.getElementById('auth-action-btn').onclick = async () => {
            let email = document.getElementById('email').value.trim();
            if (!email.includes('@')) email += '@gmail.com';
            try {
                if (isLogin) await signInWithEmailAndPassword(auth, email, document.getElementById('pass').value);
                else await createUserWithEmailAndPassword(auth, email, document.getElementById('pass').value);
            } catch (err) { alert(err.message); }
        };

        document.getElementById('google-login-btn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
        document.getElementById('nav-brand').onclick = () => showPage('home');
        document.getElementById('btn-show-auth').onclick = () => showPage('auth');

        onAuthStateChanged(auth, (user) => {
            const nav = document.getElementById('auth-nav');
            if (user) {
                nav.innerHTML = `
                    <div class="relative"><img id="avatar-btn" src="${user.photoURL || 'https://ui-avatars.com/api/?name=' + user.email}" class="w-10 h-10 rounded-full cursor-pointer">
                        <div id="user-popup" class="hidden absolute right-0 mt-2 w-48 bg-white shadow-xl p-4 border z-50">
                            <p class="text-xs font-bold truncate mb-2">${user.email}</p>
                            <p id="go-wishlist" class="cursor-pointer hover:text-blue-500 py-1">Yêu thích</p>
                            <button id="logout-btn" class="text-red-500 text-sm mt-2">Đăng xuất</button>
                        </div>
                    </div>`;
                document.getElementById('avatar-btn').onclick = (e) => { e.stopPropagation(); document.getElementById('user-popup').classList.toggle('hidden'); };
                document.getElementById('go-wishlist').onclick = () => {
                    const cont = document.getElementById('wishlist-container');
                    cont.innerHTML = wishlist.map(id => `<div class="bg-white p-4 shadow rounded border">Sản phẩm ${id}</div>`).join('');
                    showPage('wishlist');
                };
                document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => location.reload());
                showPage('home');
            }
        });
    </script>
</body>
</html>
