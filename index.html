<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Shop Phone Pro</title>
</head>
<body>

<h2 id="status">Chưa đăng nhập</h2>

<button onclick="loginGoogle()">Login Google</button>
<button onclick="logout()">Logout</button>

<hr>

<h3>Thêm sản phẩm</h3>
<input id="name" placeholder="Tên sản phẩm">
<input id="price" placeholder="Giá">
<button onclick="addProduct()">Add</button>

<hr>

<h3>Sản phẩm</h3>
<div id="products"></div>

<hr>

<h3>Giỏ hàng</h3>
<button onclick="showCart()">Xem giỏ</button>
<div id="cart"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/* ================= FIREBASE CONFIG CHÍNH ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBoX1FuReGf2onOHS8GlYq8jc5b5398hQU",
  authDomain: "banhang-b31dd.firebaseapp.com",
  projectId: "banhang-b31dd",
  storageBucket: "banhang-b31dd.firebasestorage.app",
  messagingSenderId: "634655097273",
  appId: "1:634655097273:web:899337e325e046eb91f668",
  measurementId: "G-283TYMKMXB"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;

/* ================= LOGIN GOOGLE (FIXED) ================= */
window.loginGoogle = () => {
  signInWithRedirect(auth, provider);
};

/* ================= HANDLE REDIRECT RESULT ================= */
getRedirectResult(auth)
  .then((result) => {
    if (result?.user) {
      console.log("LOGIN OK:", result.user.email);
    }
  })
  .catch((e) => {
    console.log("LOGIN ERROR:", e.code, e.message);
  });

/* ================= LOGOUT ================= */
window.logout = async () => {
  await signOut(auth);
};

/* ================= AUTH STATE ================= */
onAuthStateChanged(auth, (user) => {
  currentUser = user;
  document.getElementById("status").innerText =
    user ? "Xin chào: " + user.email : "Chưa đăng nhập";
});

/* ================= ADD PRODUCT ================= */
window.addProduct = async () => {
  if (!currentUser) return alert("Phải login");

  const name = document.getElementById("name").value;
  const price = document.getElementById("price").value;

  await addDoc(collection(db, "products"), {
    name,
    price,
    createdAt: Date.now()
  });
};

/* ================= LOAD PRODUCTS ================= */
onSnapshot(collection(db, "products"), (snap) => {
  let html = "";

  snap.forEach(doc => {
    const p = doc.data();

    html += `
      <div style="border:1px solid #ccc;padding:10px;margin:5px">
        <b>${p.name}</b><br>
        Giá: ${p.price} đ<br>
        <button onclick="addCart('${p.name}','${p.price}')">Mua</button>
      </div>
    `;
  });

  document.getElementById("products").innerHTML = html;
});

/* ================= CART ================= */
window.addCart = (name, price) => {
  let cart = JSON.parse(localStorage.getItem("cart") || "[]");
  cart.push({ name, price });
  localStorage.setItem("cart", JSON.stringify(cart));
  alert("Đã thêm vào giỏ");
};

window.showCart = () => {
  let cart = JSON.parse(localStorage.getItem("cart") || "[]");

  let total = 0;
  let html = "";

  cart.forEach(i => {
    html += `${i.name} - ${i.price} đ<br>`;
    total += Number(i.price);
  });

  html += "<hr>Tổng: " + total + " đ";

  document.getElementById("cart").innerHTML = html;
};

</script>

</body>
</html>
