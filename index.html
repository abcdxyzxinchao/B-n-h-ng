<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>My Store - Full Features</title>
</head>
<body class="bg-gray-50">

    <nav class="flex justify-between items-center p-6 bg-white shadow-sm sticky top-0 z-50">
        <h1 class="text-2xl font-bold text-blue-600 cursor-pointer" onclick="showPage('home')">MY STORE</h1>
        <div id="auth-nav"><button id="btn-login" class="px-4 py-2 bg-blue-500 text-white rounded-lg">Đăng nhập</button></div>
    </nav>

    <div id="app" class="p-6">
        <div id="page-home" class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <script>
                for(let i=1; i<=20; i++) {
                    document.write(`
                        <div class="bg-white p-4 rounded-xl shadow-md border relative">
                            <div class="h-40 bg-gray-200 mb-4 rounded"></div>
                            <h3 class="font-bold">Sản phẩm ${i}</h3>
                            <p class="text-red-500 font-semibold cursor-pointer">500.000đ</p>
                            <button onclick="toggleMenu(${i})" class="absolute top-2 right-2 text-xl font-bold">...</button>
                            <div id="menu-${i}" class="hidden absolute right-0 bg-white shadow-lg p-2 rounded border z-40">
                                <p class="cursor-pointer hover:text-blue-500" onclick="addToWishlist(${i})">Thêm yêu thích</p>
                                <p class="cursor-pointer hover:text-blue-500" onclick="showDetail(${i})">Xem chi tiết</p>
                            </div>
                        </div>
                    `);
                }
            </script>
        </div>

        <div id="page-wishlist" class="hidden">
            <h2 class="text-2xl font-bold mb-4">Danh sách yêu thích</h2>
            <div id="wishlist-container" class="grid grid-cols-1 md:grid-cols-4 gap-6"></div>
        </div>

        <div id="page-detail" class="hidden bg-white p-8 rounded-xl shadow">
            <h2 id="detail-title" class="text-3xl font-bold"></h2>
            <p class="text-xl text-red-600 mt-4">Giá: 500.000đ</p>
            <button class="mt-4 bg-green-500 text-white px-6 py-2 rounded">Mua ngay</button>
        </div>

        <div id="page-auth" class="hidden max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        
        // ... (Cấu hình Firebase y hệt cũ)

        // HÀM ĐIỀU HƯỚNG
        window.showPage = (page) => {
            ['home', 'wishlist', 'detail', 'auth'].forEach(p => document.getElementById('page-'+p).classList.add('hidden'));
            document.getElementById('page-'+page).classList.remove('hidden');
        };

        // MENU SẢN PHẨM
        window.toggleMenu = (id) => document.getElementById('menu-'+id).classList.toggle('hidden');

        // YÊU THÍCH (Lưu vào mảng tạm thời)
        let wishlist = [];
        window.addToWishlist = (id) => {
            wishlist.push(id);
            alert("Đã thêm sản phẩm " + id + " vào yêu thích!");
        };

        // XEM CHI TIẾT
        window.showDetail = (id) => {
            document.getElementById('detail-title').innerText = "Sản phẩm " + id;
            showPage('detail');
        };

        // HIỂN THỊ YÊU THÍCH
        const renderWishlist = () => {
            const container = document.getElementById('wishlist-container');
            container.innerHTML = wishlist.map(id => `
                <div class="bg-white p-4 rounded shadow">Sản phẩm ${id} đã thích</div>
            `).join('');
        };

        // Update Nav khi đăng nhập
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-nav').innerHTML = `
                    <div class="relative group">
                        <img src="${user.photoURL}" class="w-10 h-10 rounded-full cursor-pointer">
                        <div class="absolute right-0 hidden group-hover:block bg-white p-4 shadow-xl border">
                            <p class="cursor-pointer" onclick="renderWishlist(); showPage('wishlist')">Danh sách yêu thích</p>
                            <button onclick="signOut(auth).then(()=>location.reload())">Đăng xuất</button>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
