<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>My Store - Pro UI</title>
</head>
<body class="bg-gray-50">

    <nav class="flex justify-between items-center p-6 bg-white shadow-sm sticky top-0 z-50">
        <h1 class="text-2xl font-bold text-blue-600 cursor-pointer" id="nav-brand">MY STORE</h1>
        <div id="auth-nav">
            <button id="btn-show-auth" class="px-4 py-2 bg-blue-500 text-white rounded-lg">Đăng nhập</button>
        </div>
    </nav>

    <div id="app" class="p-6">
        <div id="page-home" class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <script>
                for(let i=1; i<=20; i++) {
                    document.write(`
                        <div class="bg-white p-4 rounded-xl shadow-md border relative">
                            <div class="h-40 bg-gray-200 mb-4 rounded"></div>
                            <h3 class="font-bold">Sản phẩm ${i}</h3>
                            <p class="text-red-500 font-semibold cursor-pointer">500.000đ</p>
                            <button class="menu-trigger absolute top-2 right-2 text-xl text-gray-500 font-bold p-2" data-id="${i}">...</button>
                            <div id="menu-${i}" class="hidden absolute right-0 bg-white shadow-xl p-4 rounded-xl border z-40 w-40">
                                <div class="flex justify-between mb-2">
                                    <span class="font-bold">Tùy chọn</span>
                                    <button class="close-menu text-gray-400">✕</button>
                                </div>
                                <p class="cursor-pointer hover:text-blue-500 p-1 wish-btn" data-id="${i}">Yêu thích</p>
                                <p class="cursor-pointer hover:text-blue-500 p-1 detail-btn" data-id="${i}">Chi tiết</p>
                            </div>
                        </div>
                    `);
                }
            </script>
        </div>
        <div id="page-wishlist" class="hidden">...</div>
        <div id="page-detail" class="hidden">...</div>
        <div id="page-auth" class="hidden">...</div>
    </div>

    <script type="module">
        // ... (Imports Firebase giữ nguyên)

        // HÀM ĐÓNG MỌI CỬA SỔ
        const closeAllMenus = () => {
            document.querySelectorAll('[id^="menu-"]').forEach(m => m.classList.add('hidden'));
            const userPopup = document.getElementById('user-popup');
            if (userPopup) userPopup.classList.add('hidden');
        };

        // Lắng nghe click ngoài vùng (Global Close)
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.menu-trigger') && !e.target.closest('[id^="menu-"]') && !e.target.closest('#avatar-btn')) {
                closeAllMenus();
            }
        });

        // Xử lý nút X trong menu sản phẩm
        document.querySelectorAll('.close-menu').forEach(btn => {
            btn.onclick = (e) => { e.stopPropagation(); closeAllMenus(); };
        });

        // Kích hoạt menu sản phẩm
        document.querySelectorAll('.menu-trigger').forEach(btn => {
            btn.onclick = (e) => {
                e.stopPropagation();
                closeAllMenus();
                document.getElementById('menu-' + btn.dataset.id).classList.remove('hidden');
            };
        });

        // Xử lý Popup Avatar (tương tự như trên)
        // Khi user đã đăng nhập, bạn gán sự kiện cho avatar:
        // document.getElementById('avatar-btn').onclick = (e) => { e.stopPropagation(); closeAllMenus(); document.getElementById('user-popup').classList.remove('hidden'); };

        // ... (Các logic Auth và Render khác giữ nguyên)
    </script>
</body>
</html>
