<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Web Siêu Đẹp</title>
</head>
<body class="bg-gray-50">

    <nav class="flex justify-between items-center p-6 bg-white shadow-sm sticky top-0 z-50">
        <h1 class="text-2xl font-bold text-blue-600">MY STORE</h1>
        <div id="auth-nav">
            <button onclick="showPage('login')" class="px-4 py-2 bg-blue-500 text-white rounded-lg">Đăng nhập</button>
        </div>
    </nav>

    <div id="app" class="p-6">
        <div id="page-home" class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <script>
                for(let i=1; i<=20; i++) {
                    document.write(`
                        <div class="bg-white p-4 rounded-xl shadow-md">
                            <div class="h-40 bg-gray-200 mb-4 rounded"></div>
                            <h3 class="font-bold">Sản phẩm ${i}</h3>
                            <p class="text-red-500 font-semibold cursor-pointer" onclick="alert('Mở modal mua ngay')">500.000đ</p>
                            <button class="float-right text-xl" onclick="alert('Menu: Thêm yêu thích / Xem chi tiết')">...</button>
                        </div>
                    `);
                }
            </script>
        </div>

        <div id="page-login" class="hidden max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl">
            <h2 class="text-2xl font-bold mb-6 text-center">Đăng nhập</h2>
            <input type="email" placeholder="Email" class="w-full p-3 border mb-4 rounded">
            <input type="password" placeholder="Mật khẩu" class="w-full p-3 border mb-4 rounded">
            <button class="w-full bg-blue-600 text-white p-3 rounded-lg mb-4">Đăng nhập</button>
            <button class="w-full bg-red-500 text-white p-3 rounded-lg" onclick="alert('Kết nối Firebase Google Auth')">Đăng nhập bằng Google</button>
            <p class="mt-4 text-center">Chưa có tài khoản? <a href="#" onclick="showPage('register')" class="text-blue-500">Đăng ký</a></p>
        </div>
    </div>

    <script type="module">
        // Import Firebase từ CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBoX1FuReGf2onOHS8GlYq8jc5b5398hQU",
            authDomain: "banhang-b31dd.firebaseapp.com",
            projectId: "banhang-b31dd",
            storageBucket: "banhang-b31dd.firebasestorage.app",
            messagingSenderId: "634655097273",
            appId: "1:634655097273:web:899337e325e046eb91f668"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Logic chuyển trang
        window.showPage = (page) => {
            document.getElementById('page-home').classList.add('hidden');
            document.getElementById('page-login').classList.add('hidden');
            document.getElementById('page-' + page).classList.remove('hidden');
        };

        // Lắng nghe trạng thái đăng nhập
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-nav').innerHTML = `
                    <div class="flex items-center gap-4">
                        <span>${user.email}</span>
                        <div class="w-10 h-10 bg-blue-500 rounded-full cursor-pointer" onclick="alert('Popup: Số dư: 0đ | Đơn hàng yêu thích | Đăng xuất')"></div>
                    </div>
                `;
                showPage('home');
            }
        });
    </script>
</body>
</html>
