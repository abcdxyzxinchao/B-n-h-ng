<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>My Store - Connected to Database</title>
</head>
<body class="bg-gray-50">

    <nav class="flex justify-between items-center p-6 bg-white shadow-sm sticky top-0 z-50">
        <h1 class="text-2xl font-bold text-blue-600 cursor-pointer" onclick="showPage('home')">MY STORE</h1>
        <div id="auth-nav"><button id="btn-show-auth" class="px-4 py-2 bg-blue-500 text-white rounded-lg">Đăng nhập</button></div>
    </nav>

    <div id="app" class="p-6">
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <p>Đang tải dữ liệu...</p>
        </div>

        <div id="page-admin" class="hidden bg-white p-8 rounded-2xl shadow-lg border-2 border-red-200">
            <h2 class="text-2xl font-bold text-red-600 mb-6">Quản trị hệ thống</h2>
            <div class="space-y-4">
                <input id="new-name" type="text" placeholder="Tên sản phẩm" class="w-full p-2 border">
                <input id="new-price" type="number" placeholder="Giá" class="w-full p-2 border">
                <button id="add-btn" class="bg-blue-600 text-white p-2 rounded w-full">Thêm vào Database</button>
            </div>
            <button onclick="showPage('home')" class="mt-8 text-gray-500 underline">Đóng</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyBoX1FuReGf2onOHS8GlYq8jc5b5398hQU",
            authDomain: "banhang-b31dd.firebaseapp.com",
            projectId: "banhang-b31dd",
            storageBucket: "banhang-b31dd.firebasestorage.app",
            messagingSenderId: "634655097273",
            appId: "1:634655097273:web:899337e325e046eb91f668"
        });

        const auth = getAuth(app);
        const db = getFirestore(app);

        // HÀM TẢI DỮ LIỆU
        async function loadSanPham() {
            const list = document.getElementById('product-list');
            const snapshot = await getDocs(collection(db, "sanpham"));
            list.innerHTML = "";
            snapshot.forEach(doc => {
                const sp = doc.data();
                list.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow">
                        <h3 class="font-bold">${sp.ten}</h3>
                        <p class="text-red-500">${sp.gia}đ</p>
                    </div>`;
            });
        }

        // HÀM THÊM SẢN PHẨM
        document.getElementById('add-btn').onclick = async () => {
            await addDoc(collection(db, "sanpham"), {
                ten: document.getElementById('new-name').value,
                gia: document.getElementById('new-price').value
            });
            alert("Đã thêm!");
            loadSanPham();
        };

        window.showPage = (p) => { /* logic ẩn hiện trang cũ */ };
        loadSanPham(); // Tải ngay khi vào web
    </script>
</body>
</html>
