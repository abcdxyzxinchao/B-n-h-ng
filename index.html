<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>My Store - Fix</title>
</head>
<body class="bg-gray-50">

    <nav class="flex justify-between items-center p-6 bg-white shadow-sm sticky top-0 z-50">
        <h1 class="text-2xl font-bold text-blue-600 cursor-pointer" id="nav-home">MY STORE</h1>
        <div id="auth-nav">
            <button id="btn-login" class="px-4 py-2 bg-blue-500 text-white rounded-lg">Đăng nhập</button>
        </div>
    </nav>

    <div id="app" class="p-6">
        <div id="page-home" class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <script>
                for(let i=1; i<=20; i++) {
                    document.write(`
                        <div class="bg-white p-4 rounded-xl shadow-md border">
                            <div class="h-40 bg-gray-200 mb-4 rounded"></div>
                            <h3 class="font-bold">Sản phẩm ${i}</h3>
                            <p class="text-red-500 font-semibold">500.000đ</p>
                        </div>
                    `);
                }
            </script>
        </div>

        <div id="page-auth" class="hidden max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl">
            <h2 id="auth-title" class="text-2xl font-bold mb-6 text-center">Đăng nhập</h2>
            <input id="email" type="email" placeholder="Email" class="w-full p-3 border mb-4 rounded">
            <input id="pass" type="password" placeholder="Mật khẩu" class="w-full p-3 border mb-4 rounded">
            <button id="auth-btn" class="w-full bg-blue-600 text-white p-3 rounded-lg mb-4">Đăng nhập</button>
            <button id="google-btn" class="w-full bg-red-500 text-white p-3 rounded-lg">Đăng nhập bằng Google</button>
            <p id="toggle-text" class="mt-4 text-center cursor-pointer text-blue-500 hover:underline">Chưa có tài khoản? Đăng ký</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const auth = getAuth(initializeApp({
            apiKey: "AIzaSyBoX1FuReGf2onOHS8GlYq8jc5b5398hQU",
            authDomain: "banhang-b31dd.firebaseapp.com",
            projectId: "banhang-b31dd",
            storageBucket: "banhang-b31dd.firebasestorage.app",
            messagingSenderId: "634655097273",
            appId: "1:634655097273:web:899337e325e046eb91f668"
        }));

        // Gán sự kiện bằng addEventListener (Cách chuẩn để không bị lỗi phạm vi)
        document.getElementById('nav-home').addEventListener('click', () => showPage('home'));
        document.getElementById('btn-login').addEventListener('click', () => showPage('auth'));
        document.getElementById('google-btn').addEventListener('click', () => signInWithPopup(auth, new GoogleAuthProvider()));
        document.getElementById('toggle-text').addEventListener('click', toggleMode);
        document.getElementById('auth-btn').addEventListener('click', handleAuth);

        let isLogin = true;
        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "Đăng nhập" : "Đăng ký";
            document.getElementById('auth-btn').innerText = isLogin ? "Đăng nhập" : "Đăng ký";
            document.getElementById('toggle-text').innerText = isLogin ? "Chưa có tài khoản? Đăng ký" : "Đã có tài khoản? Đăng nhập";
        }

        function showPage(page) {
            document.getElementById('page-home').classList.add('hidden');
            document.getElementById('page-auth').classList.add('hidden');
            document.getElementById('page-' + page).classList.remove('hidden');
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try {
                if (isLogin) await signInWithEmailAndPassword(auth, email, pass);
                else await createUserWithEmailAndPassword(auth, email, pass);
            } catch (err) { alert(err.message); }
        }

        onAuthStateChanged(auth, (user) => {
            const nav = document.getElementById('auth-nav');
            if (user) {
                nav.innerHTML = `<img src="${user.photoURL || 'https://ui-avatars.com/api/?name=' + user.email}" class="w-10 h-10 rounded-full border">`;
                showPage('home');
            }
        });
    </script>
</body>
</html>
