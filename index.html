<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Shop Clean Pro</title>
</head>
<body>

<h2 id="status">Loading...</h2>

<button id="loginBtn">Login Google</button>
<button id="logoutBtn">Logout</button>

<hr>

<h3>Products</h3>
<div id="products"></div>

<hr>

<h3>Cart</h3>
<div id="cart"></div>
<button id="checkoutBtn">Checkout</button>

<hr>

<h3>Profile</h3>
<div id="profile">
  <img id="avatar" width="50" style="border-radius:50%">
  <p id="email"></p>
  <p id="balance"></p>
  <p id="orders"></p>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBoX1FuReGf2onOHS8GlYq8jc5b5398hQU",
  authDomain: "banhang-b31dd.firebaseapp.com",
  projectId: "banhang-b31dd",
  storageBucket: "banhang-b31dd.firebasestorage.app",
  messagingSenderId: "634655097273",
  appId: "1:634655097273:web:899337e325e046eb91f668"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let cart = [];

/* ================= AUTH ================= */
document.getElementById("loginBtn").onclick = async () => {
  await signInWithPopup(auth, provider);
};

document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
};

/* ================= USER STATE ================= */
onAuthStateChanged(auth, async (user) => {
  currentUser = user;

  if (!user) {
    document.getElementById("status").innerText = "Not logged in";
    return;
  }

  document.getElementById("status").innerText = "Logged in";

  document.getElementById("avatar").src = user.photoURL;
  document.getElementById("email").innerText = user.email;

  await createUser(user);
  await loadProfile(user.uid);
});

/* ================= CREATE USER ================= */
async function createUser(user) {
  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    await setDoc(ref, {
      email: user.email,
      balance: 0,
      orders: 0
    });
  }
}

/* ================= PROFILE ================= */
async function loadProfile(uid) {
  const ref = doc(db, "users", uid);
  const snap = await getDoc(ref);

  const data = snap.data();

  document.getElementById("balance").innerText =
    "Balance: " + data.balance;

  document.getElementById("orders").innerText =
    "Orders: " + data.orders;
}

/* ================= PRODUCTS ================= */
onSnapshot(collection(db, "products"), (snap) => {
  const container = document.getElementById("products");
  container.innerHTML = "";

  snap.forEach(d => {
    const p = d.data();

    const div = document.createElement("div");
    div.style.border = "1px solid #ccc";
    div.style.margin = "5px";
    div.style.padding = "10px";

    div.innerHTML = `
      <b>${p.name}</b><br>
      ${p.price} đ<br>
      <button>Add Cart</button>
    `;

    div.querySelector("button").onclick = () => {
      cart.push(p);
      renderCart();
    };

    container.appendChild(div);
  });
});

/* ================= CART ================= */
function renderCart() {
  const cartDiv = document.getElementById("cart");

  let total = 0;
  cartDiv.innerHTML = "";

  cart.forEach(i => {
    total += Number(i.price);
    cartDiv.innerHTML += `${i.name} - ${i.price} đ<br>`;
  });

  cartDiv.innerHTML += "<hr>Total: " + total;
}

/* ================= CHECKOUT ================= */
document.getElementById("checkoutBtn").onclick = async () => {
  if (!currentUser) return alert("Login first");

  await addDoc(collection(db, "orders"), {
    uid: currentUser.uid,
    items: cart,
    total: cart.reduce((s,i)=>s+Number(i.price),0),
    createdAt: Date.now()
  });

  cart = [];
  renderCart();

  alert("Order success");
};

</script>

</body>
</html>
