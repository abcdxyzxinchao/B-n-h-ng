<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Shop Pro Full</title>
</head>
<body>

<!-- USER AREA -->
<div id="authArea">
  <button onclick="loginGoogle()">Login Google</button>
</div>

<div id="userBox" style="display:none;cursor:pointer;">
  <img id="avatar" width="40" style="border-radius:50%">
</div>

<div id="menu" style="display:none;border:1px solid #ccc;padding:10px;">
  <p id="userEmail"></p>
  <p id="balance"></p>
  <p id="stats"></p>
  <button onclick="openWishlist()">❤️ Wishlist</button>
  <button onclick="logout()">Logout</button>
</div>

<hr>

<!-- PRODUCT -->
<h3>Add Product</h3>
<input id="name" placeholder="name">
<input id="price" placeholder="price">
<button onclick="addProduct()">Add</button>

<h3>Products</h3>
<div id="products"></div>

<hr>

<!-- CART -->
<h3>Cart</h3>
<button onclick="checkout()">Checkout</button>
<div id="cart"></div>

<!-- WISHLIST PAGE -->
<div id="wishlistPage" style="display:none;"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBoX1FuReGf2onOHS8GlYq8jc5b5398hQU",
  authDomain: "banhang-b31dd.firebaseapp.com",
  projectId: "banhang-b31dd"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let user = null;
let cart = [];

/* ================= LOGIN ================= */
window.loginGoogle = () => {
  signInWithRedirect(auth, provider);
};

getRedirectResult(auth).catch(console.error);

/* ================= AUTH STATE ================= */
onAuthStateChanged(auth, async (u) => {
  user = u;
  if (!u) return;

  authArea.style.display = "none";
  userBox.style.display = "block";
  avatar.src = u.photoURL;

  userEmail.innerText = u.email;

  await createUserIfNotExists(u);
  loadUserData(u.uid);
});

/* ================= USER CREATE ================= */
async function createUserIfNotExists(u) {
  const ref = doc(db, "users", u.uid);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    await setDoc(ref, {
      email: u.email,
      photoURL: u.photoURL,
      balance: 0,
      totalOrders: 0
    });
  }
}

/* ================= LOAD USER ================= */
async function loadUserData(uid) {
  const ref = doc(db, "users", uid);
  const snap = await getDoc(ref);
  const data = snap.data();

  balance.innerText = "Balance: " + data.balance;
  stats.innerText = "Orders: " + data.totalOrders;
}

/* ================= MENU ================= */
userBox.onclick = () => {
  menu.style.display = menu.style.display === "none" ? "block" : "none";
};

/* ================= LOGOUT ================= */
window.logout = () => signOut(auth);

/* ================= PRODUCTS ================= */
window.addProduct = async () => {
  if (!user) return;

  await addDoc(collection(db, "products"), {
    name: name.value,
    price: price.value,
    createdAt: Date.now()
  });
};

onSnapshot(collection(db, "products"), (snap) => {
  let html = "";

  snap.forEach(d => {
    let p = d.data();

    html += `
      <div style="border:1px solid #ccc;margin:5px;padding:10px">
        <b>${p.name}</b><br>
        ${p.price} đ<br>
        <button onclick="addToCart('${p.name}',${p.price})">Cart</button>
        <button onclick="addToWishlist('${d.id}')">❤️</button>
      </div>
    `;
  });

  products.innerHTML = html;
});

/* ================= CART ================= */
window.addToCart = (name, price) => {
  cart.push({ name, price });
  renderCart();
};

function renderCart() {
  cartDiv.innerHTML = cart.map(i => i.name + " - " + i.price).join("<br>");
}

/* ================= CHECKOUT ================= */
window.checkout = async () => {
  if (!user) return;

  await addDoc(collection(db, "orders"), {
    uid: user.uid,
    items: cart,
    total: cart.reduce((s,i)=>s+Number(i.price),0),
    createdAt: Date.now()
  });

  cart = [];
  renderCart();
};

/* ================= WISHLIST ================= */
window.addToWishlist = async (pid) => {
  const ref = doc(db, "wishlist", user.uid);
  const snap = await getDoc(ref);

  let items = snap.exists() ? snap.data().items : [];

  if (!items.includes(pid)) items.push(pid);

  await setDoc(ref, { items });
};

window.openWishlist = async () => {
  const ref = doc(db, "wishlist", user.uid);
  const snap = await getDoc(ref);

  let items = snap.exists() ? snap.data().items : [];

  wishlistPage.style.display = "block";
  products.style.display = "none";

  wishlistPage.innerHTML =
    "<h3>Wishlist</h3>" +
    items.map(i => `<div>❤️ ${i}</div>`).join("");
};

</script>

<!-- DOM -->
<div id="authArea"></div>
<div id="userBox"><img id="avatar"></div>

<p id="userEmail"></p>
<p id="balance"></p>
<p id="stats"></p>

<div id="menu" style="display:none"></div>

<div id="products"></div>
<div id="cartDiv"></div>

</body>
</html>
